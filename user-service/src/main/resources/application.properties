spring.application.name=user-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

user-service.jwt.issuer=${JWT_ISSUER_URI:http://user-service:8080}
user-service.jwt.audience=${JWT_AUDIENCE:quickbite-api}
user-service.jwt.secret-base64=${JWT_SECRET_BASE64:}
user-service.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
user-service.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}

user-service.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:}
user-service.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Identity, user profile, address, and token service
