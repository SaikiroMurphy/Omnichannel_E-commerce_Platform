spring.application.name=product-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

product.jwt.issuer=${JWT_ISSUER_URI:http://user-service:8080}
product.jwt.audience=${JWT_AUDIENCE:quickbite-api}
product.jwt.secret-base64=${JWT_SECRET_BASE64:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Product catalog and administration service
