spring.application.name=payment-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

payment.mock.enabled=${PAYMENT_MOCK_ENABLED:false}
payment.jwt.issuer=${JWT_ISSUER_URI:http://user-service:8080}
payment.jwt.audience=${JWT_AUDIENCE:quickbite-api}
payment.jwt.secret-base64=${JWT_SECRET_BASE64:}
payment.services.order-url=${ORDER_SERVICE_URL:http://localhost:8083}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:payment-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
payment.kafka.order-created-topic=${ORDER_CREATED_TOPIC:order.created}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Sandbox payment processing and transaction management
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
