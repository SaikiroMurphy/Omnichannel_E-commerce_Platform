spring.application.name=gateway
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://user-service:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users,/api/users/**,/api/auth,/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCT_SERVICE_URL:http://product-service:8080}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products,/api/products/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL:http://order-service:8080}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders,/api/orders/**

spring.cloud.gateway.server.webflux.routes[3].id=inventory-service
spring.cloud.gateway.server.webflux.routes[3].uri=${INVENTORY_SERVICE_URL:http://inventory-service:8080}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/inventory,/api/inventory/**

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=${PAYMENT_SERVICE_URL:http://payment-service:8080}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments,/api/payments/**

spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications,/api/notifications/**

spring.cloud.gateway.server.webflux.routes[6].id=billing-service
spring.cloud.gateway.server.webflux.routes[6].uri=${BILLING_SERVICE_URL:http://billing-service:8080}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/billing,/api/billing/**

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

gateway.security.jwt.issuer-uri=${JWT_ISSUER_URI:}
gateway.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI:}
gateway.security.jwt.secret=${JWT_SECRET:}
gateway.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
gateway.security.jwt.audience=${JWT_AUDIENCE:quickbite-api}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept,Origin,X-Request-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Request-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=API gateway for the omnichannel e-commerce platform
