spring.application.name=order-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

order.jwt.issuer=${JWT_ISSUER_URI:http://user-service:8080}
order.jwt.audience=${JWT_AUDIENCE:quickbite-api}
order.jwt.secret-base64=${JWT_SECRET_BASE64:}
order.services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
order.services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8084}
order.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8085}
order.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Order placement and fulfillment service
