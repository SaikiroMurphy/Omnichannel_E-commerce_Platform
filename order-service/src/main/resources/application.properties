spring.application.name=order-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

order.jwt.issuer=${JWT_ISSUER_URI:http://user-service:8080}
order.jwt.audience=${JWT_AUDIENCE:quickbite-api}
order.jwt.secret-base64=${JWT_SECRET_BASE64:}
order.services.product-grpc-target=${PRODUCT_GRPC_TARGET:localhost:9090}
order.services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8084}
order.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8085}
order.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
order.kafka.order-created-topic=${ORDER_CREATED_TOPIC:order.created}

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Order placement and fulfillment service
order.kafka.payment-result-topic=${PAYMENT_RESULT_TOPIC:payment.result}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:order-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
