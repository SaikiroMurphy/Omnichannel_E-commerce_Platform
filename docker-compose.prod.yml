
name: omnichannel-prod

x-app-defaults: &app-defaults
  restart: unless-stopped
  init: true
  networks:
    - quickbite-net

x-java-healthcheck: &java-healthcheck
  test:
    - CMD-SHELL
    - wget -q --spider http://127.0.0.1:8080/actuator/health
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 60s

x-postgres-defaults: &postgres-defaults
  image: postgres:16-alpine
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - quickbite-net

x-otel-env: &otel-env
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

# Shared by every Java service: JWT settings + tracing export config.
x-jwt-env: &jwt-env
  <<: *otel-env
  JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://user-service:8080}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-quickbite-api}
  JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in .env}

services:
  # -------------------- DATABASES --------------------

  user-db:
    <<: *postgres-defaults
    environment:
      <<: *postgres-env
      POSTGRES_DB: user_db
    volumes:
      - user-db-data:/var/lib/postgresql/data

  product-db:
    <<: *postgres-defaults
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_db
    volumes:
      - product-db-data:/var/lib/postgresql/data

  order-db:
    <<: *postgres-defaults
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_db
    volumes:
      - order-db-data:/var/lib/postgresql/data

  inventory-db:
    <<: *postgres-defaults
    environment:
      <<: *postgres-env
      POSTGRES_DB: inventory_db
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  payment-db:
    <<: *postgres-defaults
    environment:
      <<: *postgres-env
      POSTGRES_DB: payment_db
    volumes:
      - payment-db-data:/var/lib/postgresql/data

  billing-db:
    <<: *postgres-defaults
    environment:
      <<: *postgres-env
      POSTGRES_DB: billing_db
    volumes:
      - billing-db-data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres-defaults
    environment:
      <<: *postgres-env
      POSTGRES_DB: notification_db
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - quickbite-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - quickbite-net

  # -------------------- USER SERVICE --------------------

  user-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-user-service:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      <<: *jwt-env
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-30d}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- PRODUCT SERVICE --------------------

  product-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-product-service:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      <<: *jwt-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PRODUCT_KAFKA_TOPIC: product.catalog.events
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- INVENTORY SERVICE --------------------

  inventory-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-inventory-service:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      <<: *jwt-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PRODUCT_KAFKA_TOPIC: product.catalog.events
    depends_on:
      inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- PAYMENT SERVICE --------------------

  payment-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-payment-service:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      <<: *jwt-env
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_CREATED_TOPIC: order.created
      PAYMENT_RESULT_TOPIC: payment.result
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- NOTIFICATION SERVICE --------------------

  notification-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-notification-service:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      <<: *jwt-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- BILLING SERVICE --------------------

  billing-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-billing-service:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://billing-db:5432/billing_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      <<: *jwt-env
    depends_on:
      billing-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- ORDER SERVICE --------------------

  order-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-order-service:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      <<: *jwt-env
      PRODUCT_SERVICE_URL: http://product-service:8080
      PRODUCT_GRPC_TARGET: product-service:9090
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_CREATED_TOPIC: order.created
      PAYMENT_RESULT_TOPIC: payment.result
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- API GATEWAY --------------------

  gateway:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-ghcr.io/saikiromurphy/omnichannel_e-commerce_platform}-gateway:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      <<: *jwt-env
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck: *java-healthcheck

  # -------------------- OBSERVABILITY --------------------

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - quickbite-net

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - quickbite-net

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - quickbite-net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - quickbite-net

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - quickbite-net

networks:
  quickbite-net:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  user-db-data:
  product-db-data:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  billing-db-data:
  notification-db-data:
  redis-data:
