services:
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5431:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  product-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  inventory-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  billing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5438:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  notification-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5437:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [quickbite-net]

  user-service:
    image: omnichannel-ecommerce/user-service:local
    build:
      context: ./user-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://user-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quickbite-api}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-30d}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

  product-service:
    image: omnichannel-ecommerce/product-service:local
    build:
      context: ./product-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://user-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quickbite-api}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
    ports:
      - "8081:8080"
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

  order-service:
    image: omnichannel-ecommerce/order-service:local
    build:
      context: ./order-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8083:8080"
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

  inventory-service:
    image: omnichannel-ecommerce/inventory-service:local
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8084:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

  payment-service:
    image: omnichannel-ecommerce/payment-service:local
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://user-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quickbite-api}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
    ports:
      - "8085:8080"
    depends_on:
      payment-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

  billing-service:
    image: omnichannel-ecommerce/billing-service:local
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://billing-db:5432/billing_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://user-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quickbite-api}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
    ports:
      - "8087:8080"
    depends_on:
      billing-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

  notification-service:
    image: omnichannel-ecommerce/notification-service:local
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8086:8080"
    depends_on:
      notification-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

  api-gateway:
    image: omnichannel-ecommerce/api-gateway:local
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quickbite-api}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}}
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [quickbite-net]

networks:
  quickbite-net:
    driver: bridge

volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  billing-db-data:
  notification-db-data:
  redis-data:
