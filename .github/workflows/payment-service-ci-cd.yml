name: Payment Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Payment Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: payment-service/pom.xml

      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-jar
          path: payment-service/target/payment-service-*.jar
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: Build and Publish Payment Service Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR with retry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5"
            if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin; then
              echo "Successfully logged in to GHCR"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Login failed; retrying in $((attempt * 5)) seconds..."
              sleep $((attempt * 5))
            fi
          done
          echo "Unable to log in to GHCR after 5 attempts"
          exit 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./payment-service
          file: ./payment-service/Dockerfile
          push: true
          tags: |
            ghcr.io/saikiromurphy/omnichannel_e-commerce_platform-payment-service:latest
            ghcr.io/saikiromurphy/omnichannel_e-commerce_platform-payment-service:${{ github.sha }}
