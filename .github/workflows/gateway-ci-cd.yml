name: Gateway CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-gateway

jobs:
  build-and-test:
    name: Build and Test Gateway
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: gateway/pom.xml

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-jar
          path: gateway/target/*.jar
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: Build and Publish Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    # Publish only after a push to main, never from a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY,,}-gateway" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}